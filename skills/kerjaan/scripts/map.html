<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kerjaan map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #eef1f6;
  --panel: rgba(255, 255, 255, 0.88);
  --panel-solid: #ffffff;
  --ink: #172033;
  --muted: #5b6680;
  --faint: #b9c2d3;
  --line: #dde2ec;
  --lane: rgba(23, 32, 51, 0.035);
  --edge-related: rgba(40, 55, 90, 0.22);
  --edge-block: #3a4560;
  --backlog: #767ca6;
  --todo: #1e7bd6;
  --in_progress: #c77800;
  --review: #8a4ad6;
  --done: #138f67;
  --cancel: #c2513b;
  --next: #d19400;
  --ready: #2b8fd9;
  --reconsider: #cf3f8a;
  --hold: #7d88a6;
  --drop: #c2513b;
  --rootless: #a7afc2;
  --active: #8a4ad6;
  --closed: #cfd5e0;
  --shadow: 0 6px 24px rgba(20, 30, 55, 0.12);
  --sans: "IBM Plex Sans Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0c111c;
    --panel: rgba(19, 26, 41, 0.9);
    --panel-solid: #141b2b;
    --ink: #e3e9f5;
    --muted: #8b96b0;
    --faint: #3d4862;
    --line: #232d44;
    --lane: rgba(255, 255, 255, 0.025);
    --edge-related: rgba(160, 180, 230, 0.2);
    --edge-block: #c8d2ea;
    --backlog: #9ba1c9;
    --todo: #5fb2ff;
    --in_progress: #ffb547;
    --review: #c28cff;
    --done: #3fcf9d;
    --cancel: #e57a62;
    --next: #ffcf4d;
    --ready: #6cc0ff;
    --reconsider: #ff72b6;
    --hold: #7f8aa8;
    --drop: #e57a62;
    --rootless: #4f5a75;
    --active: #c28cff;
    --closed: #2c3650;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--todo); outline-offset: 2px; }
[hidden] { display: none !important; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#sky.dragging { cursor: grabbing; }
#sky.pointing { cursor: pointer; }

.float {
  position: fixed;
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}

/* top bar */
#bar {
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 16px;
  right: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 8px 12px;
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
.brand h1 span { color: var(--muted); font-weight: 400; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live.on i { background: var(--done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 25%, transparent); }
.live.off i { background: var(--cancel); }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: transparent;
  border-radius: 999px; padding: 2px 9px 2px 7px;
  font-size: 12.5px; white-space: nowrap;
}
.chip b { font: 500 11px var(--mono); color: var(--muted); }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { opacity: 0.42; }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }

.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; }
.seg > span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 6px 0 4px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
#search {
  width: 210px; max-width: 100%;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-solid); padding: 4px 9px; font-size: 13px;
}
.search-wrap { display: flex; align-items: center; gap: 8px; }
#search-count { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }

/* advice panel */
#advice {
  left: 16px;
  width: 318px;
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  overflow: auto;
  padding: 12px 12px 14px;
}
#advice h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
#advice .lede { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
details.group { border-top: 1px solid var(--line); padding: 6px 0; }
details.group summary {
  list-style: none; display: flex; align-items: center; gap: 8px;
  cursor: pointer; font-weight: 600; font-size: 13px; padding: 3px 0;
}
details.group summary::-webkit-details-marker { display: none; }
details.group summary::before { content: "▸"; color: var(--muted); font-size: 10px; width: 8px; transition: transform 0.15s; }
details.group[open] summary::before { transform: rotate(90deg); }
details.group summary i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
details.group summary b { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
details.group .hint { margin: 0 0 4px 16px; font-size: 12px; color: var(--muted); }
.item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px;
  width: 100%; text-align: left; border: 0; background: transparent;
  border-radius: 7px; padding: 5px 6px 5px 16px;
}
.item:hover, .item.on { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.item .id { font: 500 11.5px var(--mono); color: var(--muted); align-self: baseline; }
.item .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.item .score { font: 500 11px var(--mono); color: var(--c, var(--muted)); align-self: baseline; }
.item .why { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg.sort { margin-bottom: 8px; }
.family summary { align-items: baseline; }
.fam-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.fam-title .id { font: 500 11.5px var(--mono); color: var(--muted); }
.family summary b { margin-left: 0; }
.fam-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; margin: 0 0 4px 16px; font-size: 11.5px; color: var(--muted); }
.fam-actions { display: flex; gap: 4px; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 0 7px; font-size: 11.5px; }
.mini:hover { border-color: var(--muted); }
.family.focused { background: color-mix(in srgb, var(--next) 8%, transparent); border-radius: 6px; }
.item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin: 0 3px 0 2px; }
.inline-link { border: 0; background: none; padding: 0; font: 500 12.5px var(--mono); color: var(--todo); text-decoration: underline; }
.formula { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend svg { display: block; }

/* detail drawer */
#detail {
  right: 16px;
  width: min(460px, calc(100vw - 32px));
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  overflow: auto;
  padding: 14px 16px 18px;
}
.d-head { display: flex; align-items: center; gap: 8px; }
.d-head .id { font: 500 12.5px var(--mono); color: var(--muted); }
.d-head button { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 0 8px; }
#detail h2 { margin: 6px 0 8px; font-size: 19px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.pill { border-radius: 999px; padding: 1px 8px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.pill.status { color: var(--panel-solid); background: var(--c); border-color: var(--c); font-weight: 600; }
.advice-box { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 9%, transparent); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.advice-box strong { color: var(--c); }
.advice-box p { margin: 3px 0 0; font-size: 13px; }
.advice-box table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; color: var(--muted); }
.advice-box td { padding: 1px 0; }
.advice-box td:last-child { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.advice-box tr.sum td { border-top: 1px solid var(--line); color: var(--ink); font-weight: 600; padding-top: 3px; }
.decide { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; }
.decide button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 5px 4px; font-size: 12.5px; }
.decide button kbd { font: 10px var(--mono); color: var(--muted); margin-right: 3px; }
.decide button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--panel-solid); }
.decide button[aria-pressed="true"] kbd { color: inherit; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 10px; font-size: 12.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.rels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
.rels > div { min-width: 0; }
.rels h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.link {
  display: flex; align-items: center; gap: 7px; width: 100%;
  border: 0; background: transparent; text-align: left; padding: 2px 4px; border-radius: 5px; font-size: 13px;
}
.link:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.link i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.link .id { font: 11.5px var(--mono); color: var(--muted); }
.link .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.md { border-top: 1px solid var(--line); padding-top: 6px; font-size: 13.5px; }
#detail .md h2, .md h3, .md h4 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li.box { list-style: none; margin-left: -18px; }
.md li.box::before { content: "☐ "; color: var(--muted); }
.md li.box.checked::before { content: "☑ "; color: var(--done); }
.md code { font: 12px var(--mono); background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0 3px; border-radius: 3px; }
.md pre { font: 12px/1.45 var(--mono); background: color-mix(in srgb, var(--ink) 6%, transparent); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--todo); }
.md table { border-collapse: collapse; font-size: 12.5px; margin-bottom: 8px; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--line); padding: 2px 6px; text-align: left; }

/* bottom bar */
#dock {
  left: 16px; right: 16px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px;
}
#dock .btn { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
#dock .btn[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); border-color: var(--ink); }
#play { width: 30px; padding: 3px 0 !important; text-align: center; }
#time { flex: 1; min-width: 60px; accent-color: var(--next); }
#time-label { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; min-width: 120px; }
.keys { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.keys kbd { font: 10.5px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
#decisions-btn b { font-family: var(--mono); }

#minimap { right: 16px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: 180px; height: 128px; padding: 0; cursor: crosshair; }

#tray {
  left: 50%; transform: translateX(-50%);
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100vw - 32px));
  padding: 12px 14px;
}
#tray h2 { margin: 0 0 4px; font-size: 15px; }
#tray p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
#tray textarea {
  width: 100%; height: 200px; resize: vertical;
  font: 12px/1.5 var(--mono); background: var(--panel-solid);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px;
}
#tray .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
#tray .row button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 12px; }
#tray .row button.primary { background: var(--ink); color: var(--panel-solid); border-color: var(--ink); }

#feed { position: fixed; right: 16px; display: grid; gap: 6px; width: min(340px, calc(100vw - 32px)); pointer-events: none; z-index: 5; }
#feed div {
  pointer-events: auto; cursor: pointer;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; box-shadow: var(--shadow);
  animation: slide 0.3s ease-out;
}
#feed div .id { font: 11.5px var(--mono); color: var(--muted); }
@keyframes slide { from { transform: translateY(-6px); opacity: 0; } }

#tip {
  position: fixed; pointer-events: none; z-index: 10;
  max-width: 340px; padding: 5px 9px; border-radius: 7px;
  background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 12.5px;
}
#tip .id { font: 11px var(--mono); color: var(--muted); }

#empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }

@media (max-width: 760px) {
  #advice { width: auto; right: 16px; }
  #search { width: 150px; }
  .keys, #minimap { display: none; }
  #time-label { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #feed div { animation: none; }
}
</style>
</head>
<body>
<canvas id="sky" aria-label="Ticket map. Use the Advice list or search to reach tickets by keyboard."></canvas>

<header id="bar" class="float">
  <div class="brand">
    <h1>kerjaan map <span id="repo"></span></h1>
    <span class="live" id="live" title="Live connection to the board"><i></i><span>connecting</span></span>
  </div>
  <div class="chips" id="chips" aria-label="Show or hide a status"></div>
  <div class="controls">
    <div class="seg" id="mode" aria-label="Group by"><span>Group</span>
      <button data-v="status">Status</button><button data-v="free">Free</button><button data-v="type">Type</button><button data-v="label">Label</button>
    </div>
    <div class="seg" id="lens" aria-label="Colour by"><span>Colour</span>
      <button data-v="status">Status</button><button data-v="advice">Advice</button>
    </div>
    <div class="seg" id="edges" aria-label="Relations"><span>Lines</span>
      <button data-v="blocks">Blocked by</button><button data-v="related">Related</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search id, title, label  /" autocomplete="off">
      <span id="search-count"></span>
    </div>
  </div>
</header>

<aside id="advice" class="float" aria-label="Advice"></aside>
<aside id="detail" class="float" aria-label="Ticket" hidden></aside>
<canvas id="minimap" class="float" aria-hidden="true"></canvas>
<section id="tray" class="float" hidden aria-label="Decisions">
  <h2>Decisions</h2>
  <p>Paste this to Claude to apply it on the board. The map itself never moves a ticket.</p>
  <textarea id="tray-text" readonly></textarea>
  <div class="row">
    <button id="tray-clear">Clear all</button>
    <button id="tray-copy" class="primary">Copy</button>
  </div>
</section>
<div id="feed" aria-live="polite"></div>
<div id="tip" hidden></div>
<div id="empty" hidden>No tickets on this board yet.</div>

<footer id="dock" class="float">
  <button class="btn" id="advice-btn" aria-pressed="true">Advice</button>
  <button class="btn" id="fit-btn" title="Fit everything (F)">Fit</button>
  <button class="btn" id="play" title="Replay the board being written">▶</button>
  <input id="time" type="range" min="0" max="1000" value="1000" aria-label="Show tickets created up to">
  <span id="time-label">all tickets</span>
  <span class="keys"><kbd>/</kbd> search <kbd>F</kbd> fit <kbd>G</kbd> group <kbd>C</kbd> colour <kbd>1</kbd>–<kbd>4</kbd> decide</span>
  <button class="btn" id="decisions-btn">Decisions <b id="decisions-count">0</b></button>
</footer>

<script>
'use strict';

// ---------- constants ----------
const STATUSES = ['backlog', 'todo', 'in_progress', 'review', 'done', 'cancel'];
const STATUS_NAME = { backlog: 'Backlog', todo: 'Todo', in_progress: 'In progress', review: 'Review', done: 'Done', cancel: 'Cancel' };
const OPEN = new Set(['backlog', 'todo', 'in_progress', 'review']);
const PRIORITY_WEIGHT = { high: 3, medium: 2, low: 1 };
const RADIUS = { high: 10, medium: 7.5, low: 5.5 };
const TYPES = ['feature', 'bug', 'task', 'chore'];
// Advice reads `related` as "came from": an open ticket is a leftover of the
// done ticket it points back to. Leftovers of the most recently touched done
// ticket are suggested first, while that work is still fresh.
const ADVICE = {
  next: { name: 'Warmest leftover' },
  ready: { name: 'Leftover, ready' },
  hold: { name: 'On hold' },
  reconsider: { name: 'Reconsider' },
  active: { name: 'In flight' },
  rootless: { name: 'No done parent' },
  closed: { name: 'Closed' },
};
const DECISIONS = [
  { key: 'pick', name: 'Pick up', c: 'next' },
  { key: 'hold', name: 'Hold', c: 'hold' },
  { key: 'skip', name: 'Skip', c: 'ready' },
  { key: 'cancel', name: 'Cancel', c: 'drop' },
];
const LANE_WIDTH = 440;
const ROW_STEP = 40;
const HOUR = 36e5, DAY = 864e5;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- small helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseTime = (s) => new Date(String(s).replace(' ', 'T')).getTime();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem('kerjaan-map:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kerjaan-map:' + k, JSON.stringify(v)); } catch {} },
};
const fmtDay = (ms) => new Date(ms).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = (ms) => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtFull = (ms) => fmtDay(ms) + ' ' + fmtTime(ms);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// ---------- state ----------
let board = null;          // last payload from /data
const nodes = new Map();   // id -> node (the drawn object, survives reloads)
let byId = new Map();      // id -> ticket
let related = new Map(), blockers = new Map(), dependents = new Map();
let relatedPairs = [], blockEdges = [];
let rows = [], days = [], lanes = [];
let now = Date.now();
let view = { x: 0, y: 0, k: 0.3 };
let mode = store.get('mode', 'status');
let lens = store.get('lens', 'status');
let edgesOn = new Set(store.get('edges', ['blocks', 'related']));
// cancel and settled done are noise for choosing what is next, so both start hidden
let hidden = new Set(store.get('hiddenStatuses', ['cancel']));

  // bears on what comes next
  const closed = (id) => !OPEN.has(byId.get(id).status);
  for (const t of tickets) {
    t.settled = t.status === 'done' && [...related.get(t.id), ...blockers.get(t.id), ...dependents.get(t.id)].every(closed);
  }

    const a = { kind: 'closed', reasons: [], parent: null, alsoFrom: [] };
    t.advice = a;
    if (!OPEN.has(t.status)) continue;
    const bl = blockers.get(t.id);
    a.openBlockers = bl.filter(open);
    a.cancelledBlockers = bl.filter((id) => byId.get(id).status === 'cancel');
    a.unlocks = [...downstream(t.id)].filter(open);

    // The parent is what the ticket itself points back to: the done ticket in
    // its own related or blocked_by created closest before it. Only when it
    // names none does a done ticket that names it count.

    const before = pool.filter((id) => byId.get(id).ms <= t.ms);
    const pick = (ids, key) => ids.reduce((best, id) => (!best || byId.get(id)[key] > byId.get(best)[key] ? id : best), null);
    a.parent = before.length ? pick(before, 'ms') : pick(pool, 'msUpdated');
    a.alsoFrom = pool.filter((id) => id !== a.parent);

    if (t.status === 'in_progress' || t.status === 'review') {
      a.kind = 'active';

    } else if (a.cancelledBlockers.length) {
      a.kind = 'reconsider';
      a.reasons.push('Blocked by cancelled ' + a.cancelledBlockers.join(', ') + ': drop the block, or cancel this too.');
    } else if (a.openBlockers.length) {
      a.kind = 'hold';
      a.reasons.push('Waiting for ' + a.openBlockers.join(', ') + ', still ' + a.openBlockers.map((id) => byId.get(id).status).join(', ') + '.');
    } else {

      if (!families.has(a.parent)) families.set(a.parent, []);
      families.get(a.parent).push(t);
    } else rootless.push(t);

    const bits = [];
    if (a.kind === 'hold' || a.kind === 'reconsider' || a.kind === 'active') bits.push(a.reasons[0]);
    if (t.status === 'todo') bits.push('already in todo' + (t.rank ? ' #' + t.rank : ''));
    if (a.unlocks.length) bits.push('frees ' + a.unlocks.length);
    bits.push((t.priority || 'no') + ' priority');
    if (a.alsoFrom.length) bits.push('also from ' + a.alsoFrom.length + ' more done');

  // it, what can start comes first, then what frees other tickets.
  const kindOrder = { active: 0, ready: 1, rootless: 1, reconsider: 2, hold: 3 };
  const inside = (x, y) => kindOrder[x.advice.kind] - kindOrder[y.advice.kind]
    || (x.status === 'todo' ? 0 : 1) - (y.status === 'todo' ? 0 : 1)
    || y.advice.unlocks.length - x.advice.unlocks.length
    || (PRIORITY_WEIGHT[y.priority] || 0) - (PRIORITY_WEIGHT[x.priority] || 0)
    || x.id.localeCompare(y.id);

// ---------- data loading ----------
async function load() {
  let payload;
  try {
    const res = await fetch('/data', { cache: 'no-store' });
    payload = await res.json();
  } catch {
    return;
  }
  const before = board ? new Map(board.tickets.map((t) => [t.id, t])) : null;
  board = payload;
  $('#repo').textContent = '· ' + payload.repo;
  document.title = 'kerjaan map · ' + payload.repo;
  if (firstLoad) decisions = new Map(store.get('decisions:' + payload.board, []));

  const t0 = performance.now();
  const present = new Set();
  for (const t of payload.tickets) {
    present.add(t.id);
    let n = nodes.get(t.id);
    if (!n) {
      n = { id: t.id, x: 0, y: 0, alpha: firstLoad ? 1 : 0, born: firstLoad ? 0 : t0 };
      nodes.set(t.id, n);
    }
    n.t = t; n.r = RADIUS[t.priority] || RADIUS.medium; n.leaving = false;
  }
  for (const [id, n] of nodes) if (!present.has(id)) { n.leaving = true; n.born = t0; }
  analyse();
  layout();
  for (const n of nodes.values()) {
    if (!n.leaving && (firstLoad || n.alpha === 0)) { n.x = n.tx; n.y = n.ty; }
  }

  if (before) announce(before, payload.tickets, t0);
  for (const id of [...decisions.keys()]) if (!byId.has(id)) decisions.delete(id);

  timeMin = Math.min(...payload.tickets.map((t) => t.ms));
  timeMax = Math.max(...payload.tickets.map((t) => t.ms));
  if (selected && !byId.has(selected)) selected = null;
  $('#empty').hidden = payload.tickets.length > 0;
  renderChips();
  renderAdvice();
  renderDetail();
  renderTray();
  runSearch(false);
  updateTimeLabel();
  if (firstLoad) { fit(false); firstLoad = false; }
  request();
}
function announce(before, after, t0) {
  const notes = [];
  for (const t of after) {
    const old = before.get(t.id);
    const n = nodes.get(t.id);
    if (!old) { notes.push([t, 'new in ' + STATUS_NAME[t.status]]); n.flash = t0; }
    else if (old.status !== t.status) { notes.push([t, STATUS_NAME[old.status] + ' → ' + STATUS_NAME[t.status]]); n.flash = t0; }
    else if (old.updated !== t.updated || old.title !== t.title) { notes.push([t, 'edited']); n.flash = t0; }
  }
  const gone = [...before.keys()].filter((id) => !byId.has(id));
  for (const id of gone) notes.push([before.get(id), 'removed from the board']);
  for (const [t, what] of notes.slice(0, 5)) toast(t, what);
  if (notes.length > 5) toast(null, (notes.length - 5) + ' more changes');

  const feed = $('#feed');
  const el = document.createElement('div');
  el.style.setProperty('--c', t ? `var(--${t.status})` : 'var(--muted)');
  el.innerHTML = t ? `<span class="id">${esc(t.id)}</span> ${esc(what)}<br>${esc(t.title)}` : esc(what);
  if (t && byId.has(t.id)) el.onclick = () => select(t.id, true);
  feed.prepend(el);
  while (feed.children.length > 5) feed.lastChild.remove();
  setTimeout(() => el.remove(), 9000);
}

// live connection
function connect() {
  const live = $('#live');
  const es = new EventSource('/events');
  es.onopen = () => { live.className = 'live on'; live.lastChild.textContent = 'live'; if (!firstLoad) load(); };
  es.onerror = () => { live.className = 'live off'; live.lastChild.textContent = 'server stopped — run map.mjs again'; };
  es.addEventListener('change', load);
}

// ---------- view ----------

    if (f) return new Set([f.parent.id, ...f.members.map((t) => t.id)]);

  const dec = decisions.get(t.id);
  const siblings = a.parent ? familyList.find((f) => f.parent.id === a.parent).members.filter((x) => x.id !== t.id).length : 0;
  const adviceBox = a.kind === 'closed' ? '' : `
    <div class="advice-box" style="--c:var(--${a.kind})">
      <strong>${ADVICE[a.kind].name}</strong>
      <p>${a.parent
        ? `Came from done <button class="inline-link" data-id="${a.parent}">${a.parent}</button>${siblings ? `, together with ${plural(siblings, 'other open ticket')}` : ''}.`
        : 'Points to no done ticket yet.'}
      ${a.unlocks.length ? ` Finishing it frees ${plural(a.unlocks.length, 'ticket')}.` : ''}
      ${a.reasons.length && a.kind !== 'active' ? ' ' + esc(a.reasons.join(' ')) : ''}</p>
      ${a.parent ? `<p><button class="mini" data-show="${a.parent}">Show this family on the map</button></p>` : ''}
    </div>`;
  const others = [...related.get(t.id)];
  el.innerHTML = `
    <div class="d-head"><span class="id">${t.id}</span><button id="close" aria-label="Close">Esc</button></div>
    <h2>${esc(t.title)}</h2>
    <div class="pills">
      <span class="pill status" style="--c:var(--${t.status})">${STATUS_NAME[t.status]}</span>
      <span class="pill">${esc(t.type || 'no type')}</span>
      <span class="pill">${esc(t.priority || 'no priority')}</span>
      ${t.labels.map((l) => `<span class="pill">${esc(l)}</span>`).join('')}
    </div>
    ${adviceBox}
    ${OPEN.has(t.status) ? `<div class="decide">${DECISIONS.map((d, i) =>
      `<button data-d="${d.key}" style="--c:var(--${d.c})" aria-pressed="${dec === d.key}"><kbd>${i + 1}</kbd>${d.name}</button>`).join('')}</div>` : ''}
    <dl class="facts">
      <dt>Created</dt><dd>${esc(t.created)}</dd>
      <dt>Updated</dt><dd>${esc(t.updated)}</dd>
      ${t.checks[1] ? `<dt>Done when</dt><dd>${t.checks[0]} of ${t.checks[1]} ticked</dd>` : ''}
    </dl>
    <div class="rels">
      ${linkList('Blocked by', blockers.get(t.id))}
      ${linkList('Holds up', dependents.get(t.id))}
      ${linkList('Related', others)}
    </div>
    <div class="md">${markdown(t.body)}</div>`;
}
$('#detail').addEventListener('click', (e) => {
  if (e.target.closest('#close')) return select(null);
  const l = e.target.closest('.link, .inline-link'); if (l) return select(l.dataset.id, true);
  const f = e.target.closest('[data-show]'); if (f) return showFamily(f.dataset.show);
  const d = e.target.closest('[data-d]'); if (d) decide(selected, d.dataset.d);
});

function decide(id, key) {
  if (!id || !OPEN.has(byId.get(id).status)) return;
  if (!key || decisions.get(id) === key) decisions.delete(id); else decisions.set(id, key);
  store.set('decisions:' + board.board, [...decisions]);
  renderDetail(); renderTray(); request();
}
function renderTray() {
  $('#decisions-count').textContent = decisions.size;
  if (!board) return;
  const stamp = new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const lines = [`Decisions from the kerjaan map (${board.repo}, ${stamp}):`];
  const text = {
    pick: 'Pick up, in this order — move to todo and write order.md:',
    hold: 'Hold — leave in backlog, note why in the ticket:',
    skip: 'Skip for now — no change on the board:',
    cancel: 'Cancel — move to cancel with a one-line reason:',
  };
  for (const d of DECISIONS) {
    const ids = [...decisions].filter(([, v]) => v === d.key).map(([id]) => id);
    if (!ids.length) continue;
    lines.push('', text[d.key]);
    ids.forEach((id, i) => lines.push(`${d.key === 'pick' ? (i + 1) + '.' : '-'} ${id} ${byId.get(id).title}`));
  }
  if (!decisions.size) lines.push('', '(nothing decided yet — open a ticket and press 1–4)');
  $('#tray-text').value = lines.join('\n');
}
$('#decisions-btn').onclick = () => { $('#tray').hidden = !$('#tray').hidden; };
$('#tray-copy').onclick = async () => {
  const ta = $('#tray-text');
  try { await navigator.clipboard.writeText(ta.value); }
  catch { ta.select(); document.execCommand('copy'); }
  $('#tray-copy').textContent = 'Copied';
  setTimeout(() => { $('#tray-copy').textContent = 'Copy'; }, 1500);
};
$('#tray-clear').onclick = () => { decisions.clear(); store.set('decisions:' + board.board, []); renderTray(); renderDetail(); request(); };

function layoutFeed() {
  const bar = $('#bar').getBoundingClientRect();
  const feed = $('#feed');
  feed.style.top = bar.bottom + 10 + 'px';
  feed.style.right = !$('#detail').hidden && innerWidth > 760 ? `calc(16px + min(460px, 100vw - 32px) + 10px)` : '16px';
  const top = bar.bottom + 10 + 'px';
  $('#advice').style.top = top;
  $('#detail').style.top = top;
}

// ---------- tiny markdown ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '$1');
}
function markdown(src) {
  const out = [];
  const lines = src.split('\n');
  let para = [], list = null;
  const flush = () => {
    if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
    if (list) { out.push(`</${list}>`); list = null; }
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush();
      const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^\|.*\|\s*$/.test(line)) {
      flush();
      const table = [];
      for (; i < lines.length && /^\|.*\|\s*$/.test(lines[i]); i++) table.push(lines[i]);
      i--;
      const cells = (l) => l.trim().slice(1, -1).split('|').map((c) => inline(c.trim()));
      const body = table.filter((l) => !/^\|[\s:|-]+\|\s*$/.test(l));
      out.push('<table>' + body.map((l, r) => '<tr>' + cells(l).map((c) => r ? `<td>${c}</td>` : `<th>${c}</th>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) { flush(); const lv = Math.min(4, Math.max(2, h[1].length)); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); continue; }
    const li = line.match(/^\s*(?:([-*])|(\d+)\.)\s+(.*)/);
    if (li) {
      if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
      const kind = li[2] ? 'ol' : 'ul';
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      const box = li[3].match(/^\[([ xX])\]\s*(.*)/);
      out.push(box ? `<li class="box${box[1] !== ' ' ? ' checked' : ''}">${inline(box[2])}</li>` : `<li>${inline(li[3])}</li>`);
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    if (list && /^\s+/.test(line)) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ' ' + inline(line.trim()) + '</li>'); continue; }
    if (list) { out.push(`</${list}>`); list = null; }
    para.push(line.trim());
  }
  flush();
  return out.join('\n');
}

// ---------- selection & search ----------
function select(id, fly = false) {
  selected = id && byId.has(id) ? id : null;
  if (!id && focusFamily) { focusFamily = null; renderAdvice(); }
  if (selected && hidden.has(byId.get(selected).status)) { hidden.delete(byId.get(selected).status); store.set('hiddenStatuses', [...hidden]); renderChips(); }
  if (selected && byId.get(selected).settled && !showSettled) { showSettled = true; store.set('settled', true); renderChips(); }
  if (selected && byId.get(selected).ms > timeCut) { timeCut = Infinity; $('#time').value = 1000; updateTimeLabel(); }
  renderDetail();
  document.querySelectorAll('#advice .item').forEach((b) => b.classList.toggle('on', b.dataset.id === selected));
  if (selected && fly) {
    const n = nodes.get(selected);
    requestAnimationFrame(() => goTo(n.tx, n.ty, Math.max(view.k, 1.3)));
  }
  request();
}
function runSearch(jump) {
  const q = query.trim().toLowerCase();
  matches = !q || !board ? [] : board.tickets.filter((t) =>
    t.id.includes(q) || t.title.toLowerCase().includes(q) || t.labels.some((l) => l.toLowerCase() === q)).map((t) => t.id);
  $('#search-count').textContent = q ? (matches.length ? `${matchIndex >= 0 ? matchIndex + 1 + '/' : ''}${matches.length}` : 'none') : '';
  if (jump && matches.length) {
    matchIndex = (matchIndex + 1) % matches.length;
    select(matches[matchIndex], true);
    $('#search-count').textContent = `${matchIndex + 1}/${matches.length}`;
  }
  request();
}
$('#search').addEventListener('input', (e) => { query = e.target.value; matchIndex = -1; runSearch(false); });
$('#search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runSearch(true); }
  if (e.key === 'Escape') { e.target.value = ''; query = ''; runSearch(false); e.target.blur(); }
});

// ---------- controls ----------
function setSeg(id, value, multi) {
  document.querySelectorAll(`#${id} button`).forEach((b) =>
    b.setAttribute('aria-pressed', multi ? value.has(b.dataset.v) : b.dataset.v === value));
}
function setMode(m) {
  mode = m; store.set('mode', m); setSeg('mode', m);
  if (board) { layout(); fit(); }
}
function setLens(l) {
  lens = l; store.set('lens', l); setSeg('lens', l); request();
}
$('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.v); });
$('#lens').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setLens(b.dataset.v); });
$('#edges').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  edgesOn.has(b.dataset.v) ? edgesOn.delete(b.dataset.v) : edgesOn.add(b.dataset.v);
  store.set('edges', [...edgesOn]); setSeg('edges', edgesOn, true); request();
});
$('#advice-btn').onclick = () => { adviceOpen = !adviceOpen; store.set('advice', adviceOpen); renderAdvice(); request(); };
$('#fit-btn').onclick = () => fit();

// time: replay the board being written
function updateTimeLabel() {
  $('#time-label').textContent = timeCut === Infinity ? 'all tickets' : 'created by ' + fmtFull(timeCut);
}
$('#time').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  timeCut = v >= 1000 ? Infinity : timeMin + ((timeMax - timeMin) * v) / 1000;
  updateTimeLabel(); request();
});
$('#play').onclick = () => {
  if (playing) { playing = false; $('#play').textContent = '▶'; return; }
  playing = true; $('#play').textContent = '❚❚';
  const range = $('#time');
  if (Number(range.value) >= 1000) range.value = 0;
  let last = performance.now();
  const step = (ts) => {
    if (!playing) return;
    const v = Math.min(1000, Number(range.value) + (ts - last) * 0.07);
    last = ts;
    range.value = v;
    range.dispatchEvent(new Event('input'));
    if (v >= 1000) { playing = false; $('#play').textContent = '▶'; return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

// ---------- pointer: pan, pinch, wheel, pick ----------
const pointers = new Map();
let dragStart = null, moved = false, pinch = null;
function hitTest(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let best = null, bestD = Infinity;
  for (const n of nodes.values()) {
    if (!visible(n)) continue;
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < n.r * 1.3 + 6 / view.k && d < bestD) { best = n; bestD = d; }
  }
  return best;
}
sky.addEventListener('pointerdown', (e) => {
  sky.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) { dragStart = [e.clientX, e.clientY, view.x, view.y]; moved = false; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k };
    moved = true;
  }
  flight = null;
});
sky.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (pinch.k * d) / pinch.d / view.k);
    return;
  }
  if (pointers.size === 1 && dragStart) {
    const dx = e.clientX - dragStart[0], dy = e.clientY - dragStart[1];
    if (Math.hypot(dx, dy) > 4) moved = true;
    if (moved) { view.x = dragStart[2] + dx; view.y = dragStart[3] + dy; sky.classList.add('dragging'); request(); }
    return;
  }
  const n = hitTest(e.clientX, e.clientY);
  const id = n ? n.id : null;
  if (id !== hovered) { hovered = id; request(); }
  sky.classList.toggle('pointing', !!n);
  const tip = $('#tip');
  if (n && view.k < 0.85) {
    tip.hidden = false;
    tip.innerHTML = `<span class="id">${n.id} · ${STATUS_NAME[n.t.status]}</span><br>${esc(n.t.title)}`;
    tip.style.left = Math.min(e.clientX + 14, W - 350) + 'px';
    tip.style.top = e.clientY + 14 + 'px';
  } else tip.hidden = true;
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    sky.classList.remove('dragging');
    if (!moved && e.type === 'pointerup') {
      const n = hitTest(e.clientX, e.clientY);
      select(n ? n.id : null);
    }
    dragStart = null;
  }
}
sky.addEventListener('pointerup', endPointer);
sky.addEventListener('pointercancel', endPointer);
sky.addEventListener('pointerleave', () => { if (hovered) { hovered = null; request(); } $('#tip').hidden = true; });
sky.addEventListener('dblclick', (e) => {
  const n = hitTest(e.clientX, e.clientY);
  if (n) { select(n.id); goTo(n.tx, n.ty, Math.max(view.k * 2, 1.6)); }
  else zoomAt(e.clientX, e.clientY, 2);
});
sky.addEventListener('wheel', (e) => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? H : 1;
  // pinch on a trackpad arrives as ctrl+wheel; a mouse wheel moves in big
  // whole steps; everything else is a two-finger scroll, which pans
  const mouseWheel = e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  if (e.ctrlKey || mouseWheel) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * unit * (e.ctrlKey ? 0.01 : 0.0018)));
  else { view.x -= e.deltaX * unit; view.y -= e.deltaY * unit; flight = null; request(); }
}, { passive: false });

addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); $('#search').focus(); }
  else if (k === 'f') fit();
  else if (k === 'g') { const m = ['status', 'free', 'type', 'label']; setMode(m[(m.indexOf(mode) + 1) % m.length]); }
  else if (k === 'c') setLens(lens === 'status' ? 'advice' : 'status');
  else if (k === 'a') $('#advice-btn').click();
  else if (k === 'escape') { if (!$('#tray').hidden) $('#tray').hidden = true; else select(null); }
  else if (/^[1-4]$/.test(k) && selected) decide(selected, DECISIONS[Number(k) - 1].key);
  else if (k === '0' && selected) decide(selected, null);
  else if (k === '+' || k === '=') zoomAt(W / 2, H / 2, 1.4);
  else if (k === '-') zoomAt(W / 2, H / 2, 1 / 1.4);
});

// ---------- start ----------
addEventListener('resize', resize);
setSeg('mode', mode); setSeg('lens', lens); setSeg('edges', edgesOn, true);
readColors();
resize();
renderAdvice();
document.fonts?.ready.then(() => { measureCache.clear(); for (const k in cssCache) delete cssCache[k]; request(); });
load().then(connect);
requestAnimationFrame(frame);
</script>
</body>
</html>
